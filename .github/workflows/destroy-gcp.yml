name: Destroy GCP deployment

# Runs only when started by hand from the Actions tab
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to delete the Cloud Run service, registry and images
        required: true
        type: string

# Deploy and destroy share one Terraform state, so never run them together
concurrency:
  group: gcp-terraform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp
    steps:
      - uses: actions/checkout@v4

      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::Nothing was deleted. Type destroy to confirm."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve
